<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Portafolio Isaías García</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Portafolio de Isaías García Zambrano: certificados, publicaciones, participación tecnológica y CV.">
<style>
/* Diseño: página larga de secciones numeradas, encabezado fijo con selector ES / EN, Arial 12 pt y tonos sobrios. */
:root{
  --bg:#f5f3ee; --card:#fffdf9; --ink:#2b2f33; --muted:#5d6670;
  --accent:#35575c; --accent-soft:#e3ebea; --warm:#9a6b3f; --warm-soft:#f1e7da;
  --border:#d9d4c9; --accent-hover:#2a464a; --on-accent:#ffffff; --cv-bg:#ffffff; --scrim:rgba(35,40,45,.55); --thumb:#efebe3; --terra:#b4653a; --mustard:#d29d35; --sage:#6f9577;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1f22; --card:#23282c; --ink:#e6e3dc; --muted:#a3abb2;
    --accent:#8fb4b8; --accent-soft:#2a3a3c; --warm:#d0a070; --warm-soft:#3a2f24;
    --border:#3a4146; --accent-hover:#a6c6c9; --on-accent:#14201f; --cv-bg:#202427; --scrim:rgba(0,0,0,.65); --thumb:#2d3338; --terra:#e08f5f; --mustard:#e2b45a; --sage:#9bc3a3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1f22; --card:#23282c; --ink:#e6e3dc; --muted:#a3abb2;
  --accent:#8fb4b8; --accent-soft:#2a3a3c; --warm:#d0a070; --warm-soft:#3a2f24;
  --border:#3a4146; --accent-hover:#a6c6c9; --on-accent:#14201f; --cv-bg:#202427; --scrim:rgba(0,0,0,.65); --thumb:#2d3338; --terra:#e08f5f; --mustard:#e2b45a; --sage:#9bc3a3;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:12pt;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
h1,h2,h3,p,ul{margin:0}
em{font-style:italic;color:var(--accent)}
a{color:var(--accent)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding:64px 0 8px}
.lead{color:var(--muted);margin:6px 0 24px;max-width:680px}
.sec{font-size:1.7em;line-height:1.25;text-wrap:balance}
.sec .num{display:block;font-size:.5em;color:var(--warm);letter-spacing:.08em;margin-bottom:4px}

/* Encabezado */
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--border)}
.nav .wrap{display:flex;align-items:center;gap:14px;min-height:56px}
.logo{font-weight:bold;font-size:1.25em;color:var(--ink);text-decoration:none}
.logo span{color:var(--accent)}
.nav nav{flex:1;min-width:0}
.nav ul{list-style:none;padding:0;display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.nav a.link{display:block;padding:6px 9px;border-radius:6px;text-decoration:none;color:var(--muted);font-size:.9em}
.nav a.link:hover{background:var(--accent-soft);color:var(--accent)}
.nav a.link.active{background:var(--accent);color:var(--on-accent)}
.langs{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.langs button{font:inherit;font-size:.85em;background:transparent;color:var(--muted);border:none;padding:5px 10px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.menu-btn{display:none;font:inherit;background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--ink)}
@media(max-width:940px){
  .menu-btn{display:block;margin-left:auto}
  .nav nav{position:absolute;top:56px;left:0;right:0;flex:none;background:var(--card);border-bottom:1px solid var(--border);padding:8px max(16px,env(safe-area-inset-left,0px));display:none}
  .nav nav.open{display:block}
  .nav ul{flex-direction:column;justify-content:flex-start}
}

/* Inicio */
.hero{padding:72px 0 16px}
.tag{display:inline-block;background:var(--warm-soft);color:var(--warm);padding:3px 12px;border-radius:20px;margin-bottom:16px;font-size:.85em;letter-spacing:.03em}
.hero h1{font-size:2.9em;line-height:1.1;text-wrap:balance}
.hero .sub{font-size:1.2em;margin:16px 0 8px;max-width:640px}
.hero .desc{color:var(--muted);max-width:640px;margin-bottom:24px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.hero .loc{margin-top:22px;color:var(--muted);font-size:.92em}

/* Tarjetas */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}
.about{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:20px}
@media(max-width:760px){.about{grid-template-columns:1fr}}
.about p+p{margin-top:.8em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:3px 12px;font-size:.88em}
.meta{color:var(--muted);font-size:.9em}

/* Certificados */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter{font:inherit;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 16px;cursor:pointer;color:var(--ink)}
.filter:hover{border-color:var(--accent)}
.filter[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cert{text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.cert:hover,.cert:focus-visible{transform:translateY(-3px);border-color:var(--accent);outline:none}
.thumb{height:180px;background:var(--thumb);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:4px}
.thumb img{max-width:100%;max-height:100%;display:block}
.thumb img.cover{width:100%;height:100%;object-fit:cover}
.thumb img.wide{width:100%;height:100%;object-fit:contain;padding:6px}
.more{margin-top:auto;color:var(--accent);font-size:.92em}

/* Publicaciones */
.pub{margin-bottom:14px}
.pub .meta{margin:4px 0 8px}
.pub details{margin-top:10px}
.pub summary{cursor:pointer;color:var(--accent)}
.pub details p{margin-top:8px;color:var(--muted)}
.pub .links{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}

/* Habilidades */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.skills h3{font-size:1em;color:var(--warm);margin-bottom:6px}
.skills ul{padding-left:18px;color:var(--ink)}
.skills li{margin-bottom:3px}

/* Educación y experiencia */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.two h3{font-size:1.05em;margin-bottom:12px;color:var(--warm)}
.timeline{list-style:none;padding:0 0 0 20px;border-left:2px solid var(--border)}
.timeline li{position:relative;padding:0 0 18px 16px}
.timeline li::before{content:"";position:absolute;left:-28px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.timeline .when{color:var(--warm);font-size:.88em}

/* Participación */
.part{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.part .no{color:var(--warm);font-size:.85em;letter-spacing:.06em}
.part h3{margin:4px 0 6px}

/* CV */
.cv-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cv{background:var(--cv-bg);border:1px solid var(--border);border-radius:10px;padding:28px}
.cv h1{font-size:1.7em}
.cv .role{color:var(--muted);margin:2px 0 8px}
.cv .contact{color:var(--muted);font-size:.95em;margin-bottom:12px}
.cv h3{border-bottom:1px solid var(--border);padding-bottom:3px;margin:18px 0 8px;color:var(--accent);text-transform:uppercase;font-size:.9em;letter-spacing:.05em}
.cv ul{padding-left:18px}
.cv li{margin-bottom:4px}

/* Contacto */
.contact-list{list-style:none;padding:0;display:grid;gap:10px;margin-top:12px}
.contact-list li{overflow-wrap:anywhere}
footer{margin-top:56px;padding:24px 0;border-top:1px solid var(--border);color:var(--muted);font-size:.9em}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Ventana */
.overlay{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:12px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px;position:relative}
.modal h3{font-size:1.25em;margin:12px 0 2px;padding-right:28px}
.modal .pic{background:var(--thumb);border-radius:8px;display:flex;justify-content:center;padding:10px}
.modal .pic img{max-width:100%;max-height:58vh;display:block}
.modal .pic img.badge{width:180px}
.modal dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.modal dt{color:var(--muted)}
.modal dd{margin:0}
.close{position:absolute;top:8px;right:12px;font:inherit;font-size:1.4em;background:none;border:none;cursor:pointer;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cert{transition:none}}

/* ===== Movimiento y mascotas ===== */
.progress{position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:linear-gradient(90deg,var(--terra),var(--mustard),var(--sage));transform-origin:left;transform:scaleX(0)}
.hero{position:relative;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-30px -16px 0;z-index:-1;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 72% 78% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 72% 78% at 50% 50%,#000 55%,transparent 100%);
  background:radial-gradient(circle at 88% 18%,color-mix(in srgb,var(--mustard) 24%,transparent),transparent 46%),radial-gradient(circle at 8% 92%,color-mix(in srgb,var(--sage) 22%,transparent),transparent 42%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:center}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr}}
.hero h1 em{background:linear-gradient(90deg,var(--accent),var(--terra),var(--accent));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 7s linear infinite}
.hrole{font-size:1.15em;font-weight:bold;color:var(--terra);margin-top:10px;min-height:1.6em}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--terra);margin-left:3px;vertical-align:-.15em;animation:caret 1s steps(1) infinite}
.stage{position:relative;min-height:400px;display:flex;align-items:flex-end;justify-content:center}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;animation:drift 9s ease-in-out infinite}
.b1{width:190px;height:190px;background:var(--mustard);left:8%;bottom:30px;opacity:.28}
.b2{width:130px;height:130px;background:var(--sage);right:6%;bottom:110px;animation-delay:-3s;opacity:.35}
.b3{width:90px;height:90px;background:var(--terra);right:22%;top:60px;animation-delay:-6s;opacity:.25}
.sym{position:absolute;font-weight:bold;font-size:1.05em;opacity:.8;animation:floaty 6s ease-in-out infinite}
.s1{left:6%;top:90px;color:var(--accent)}
.s2{right:8%;top:130px;color:var(--terra);animation-delay:-2s}
.s3{left:14%;bottom:150px;color:var(--mustard);animation-delay:-4s}
.s4{right:12%;bottom:70px;color:var(--sage);animation-delay:-1s}
.say{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:min(250px,86%);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;font-size:.88em;text-align:center;z-index:2}
.say::after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:var(--card);border-right:1px solid var(--border);border-bottom:1px solid var(--border);transform:translateX(-50%) rotate(45deg)}
.chispa-wrap{position:relative;z-index:1;width:230px;max-width:70%;background:none;border:none;padding:0;cursor:pointer;color:var(--ink)}
.chispa-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.chispa-wrap.jump{animation:jump .6s ease-out}
.f-acc{fill:var(--accent)}.f-terra{fill:var(--terra)}.f-mus{fill:var(--mustard)}.f-sage{fill:var(--sage)}.f-dark{fill:#1f2a2c}.f-cap{fill:#2d3a3d}.f-cream{fill:#f5f3ee}
.s-acc{stroke:var(--accent)}.s-mus{stroke:var(--mustard)}
.bob{animation:bob 3.6s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 3.6s ease-in-out infinite}
.arm{transform-box:view-box;transform-origin:162px 170px;animation:wave 2.6s ease-in-out infinite}
.tassel{transform-box:view-box;transform-origin:120px 52px;animation:swing 3s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.pupil{transition:transform .12s ease-out}
.led{animation:led 1.6s ease-in-out infinite}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:26px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;transition:transform .2s}
.stat:hover{transform:translateY(-4px) rotate(-1deg)}
.stat b{display:block;font-size:2em;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.stat:nth-child(2) b{color:var(--terra)}.stat:nth-child(3) b{color:var(--sage)}.stat:nth-child(4) b{color:var(--warm)}
.stat span{color:var(--muted);font-size:.9em}

.ticker{overflow:hidden;margin:34px 0 0;border-block:1px solid var(--border);background:var(--card);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;width:max-content;animation:marquee 38s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.tk{padding:10px 22px;white-space:nowrap;color:var(--muted)}
.tk i{font-style:normal;margin-right:12px}

.sec em{background:linear-gradient(transparent 64%,color-mix(in srgb,var(--mustard) 42%,transparent) 64%) no-repeat 0 0/0% 100%;transition:background-size .9s ease .2s}
.sec.in em{background-size:100% 100%}
.rv{opacity:.72;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
.grid .cert,.part .card{animation:pop .4s ease backwards}
.cert{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.cert:hover,.cert:focus-visible{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-5px)}
.tiltc{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s}
.part .thumb{height:170px}
.btn{transition:transform .15s,background .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.14)}
.chip{transition:transform .15s}
.chip:hover{transform:translateY(-2px) rotate(-2deg)}
footer{padding-bottom:120px}

.companion{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.companion>*{pointer-events:auto}
.nopets .companion{display:none}
.pbubble{position:relative;max-width:210px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 26px 8px 12px;font-size:.8em;line-height:1.4;animation:pop .3s ease}
.pbubble::after{content:"";position:absolute;right:34px;bottom:-7px;width:12px;height:12px;background:var(--card);border-right:1px solid var(--border);border-bottom:1px solid var(--border);transform:rotate(45deg)}
.pbubble .x{position:absolute;top:2px;right:4px;font:inherit;background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 6px}
.pet{width:84px;background:none;border:none;padding:0;cursor:pointer}
.pet svg{width:100%;height:auto;display:block;overflow:visible}
.pet.hop{animation:hop .55s ease-out}
.tail{transform-box:view-box;transform-origin:92px 112px;animation:tail 2.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@media(max-width:520px){.pbubble{max-width:160px;font-size:.74em}.pet{width:68px}}

.confetti{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:60;animation:fly .9s ease-out forwards}
.heart{position:fixed;pointer-events:none;z-index:60;color:var(--terra);font-size:20px;animation:rise 1.1s ease-out forwards}

@keyframes shift{to{background-position:-200% 0}}
@keyframes caret{50%{opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-18px)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shadow{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-24deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-24deg)}}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes pop{from{transform:scale(.93);opacity:.4}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.06,.92)}55%{transform:translateY(-34px) scale(.96,1.05)}100%{transform:translateY(0) scale(1,1)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-16px)}70%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
@keyframes tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes rise{to{transform:translateY(-70px) scale(1.3);opacity:0}}
/* Enlaces como botones */
.nav a.link{border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:.85em;transition:transform .15s,background .15s}
.nav a.link:hover{transform:translateY(-2px);border-color:var(--accent)}
.nav ul{gap:5px}
.btn.big{padding:12px 22px;font-weight:bold}
.btn.ext::after{content:"\2197";margin-left:8px;display:inline-block;transition:transform .15s}
.btn.ext:hover::after{transform:translate(2px,-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:12px}
.cc{display:flex;flex-direction:column;gap:8px;min-width:0}
.cc h3{font-size:1em;color:var(--warm)}
.cc .val{color:var(--muted);font-size:.9em;overflow-wrap:anywhere}
.cc .btns{margin-top:auto;padding-top:6px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.sec em{background-size:100% 100%}}
</style>

/* =========================================================
   LÓGICA
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lang = "es";
try { const s = localStorage.getItem("ig-lang"); if (s === "en" || s === "es") lang = s; } catch(_) {}
const t = k => I18N[lang][k];
const L = v => (v && typeof v === "object" && !Array.isArray(v)) ? v[lang] : v;
let filtro = "all";

function estatico(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { el.innerHTML = t(el.dataset.i); });
  $("#lang-es").setAttribute("aria-pressed", lang === "es");
  $("#lang-en").setAttribute("aria-pressed", lang === "en");
  $("#mClose").setAttribute("aria-label", t("m_close"));
  $("#loc").textContent = L(PERFIL.ciudad);
  $("#areas").innerHTML = AREAS[lang].map(a => `<span class="chip">${esc(a)}</span>`).join("");
  $("#copyCv").textContent = t("v_copy");
  const hidden = $("#cv-sheet").hidden;
  $("#toggleCv").textContent = hidden ? t("v_show") : t("v_hide");
}

function filtros(){
  const orgs = ["all", ...new Set(CERTS.map(c => c.org))];
  $("#filters").innerHTML = orgs.map(o =>
    `<button class="filter" aria-pressed="${o === filtro}" data-o="${esc(o)}">${o === "all" ? esc(t("f_all")) : esc(o)}</button>`).join("");
}
function certs(){
  const lista = CERTS.map((c,i) => ({...c,i})).filter(c => filtro === "all" || c.org === filtro);
  $("#certGrid").innerHTML = lista.map(c => `
    <button class="card cert" data-i2="${c.i}" aria-label="${esc(c.titulo)}">
      <div class="thumb"><img class="${c.tipo === "cert" ? "wide" : ""}" src="${c.img}" alt="${esc(c.titulo)} – ${esc(c.org)}" loading="lazy"></div>
      <h3>${esc(c.titulo)}</h3>
      <div class="meta">${esc(c.org)} · ${esc(L(c.fechaTxt))}</div>
      <span class="more">${esc(t("c_more"))}</span>
    </button>`).join("");
}
function pubs(){
  $("#pubs").innerHTML = PUBS.map(p => `
    <article class="card pub">
      <span class="chip">${esc(L(p.tipo))}</span>
      <h3 style="margin-top:8px">${esc(p.titulo)}</h3>
      <div class="meta">${esc(L(p.medio))} · ${esc(L(p.fecha))}</div>
      <details><summary>${esc(t("p_sum"))}</summary><p>${esc(L(p.resumen))}</p></details>
      <div class="links">
        <a class="btn ext" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t("p_read"))}</a>
        ${p.extra ? `<a class="btn ghost ext" href="${esc(p.extra.url)}" target="_blank" rel="noopener">${esc(p.extra.texto)}</a>` : ""}
      </div>
    </article>`).join("");
}
function habilidades(){
  $("#skills").innerHTML = SKILLS.map(s => `
    <div class="card"><h3>${esc(L(s.g))}</h3><ul>${s.items[lang].map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");
}
function linea(arr){
  return `<ul class="timeline">${arr.map(x => `
    <li>${L(x.cuando) ? `<div class="when">${esc(L(x.cuando))}</div>` : ""}
      <h3 style="color:var(--ink);font-size:1.05em;margin:0">${esc(L(x.titulo))}</h3>
      <div class="meta">${esc(L(x.lugar))}</div>
      ${x.detalle ? `<p style="margin-top:6px">${esc(L(x.detalle))}</p>` : ""}
    </li>`).join("")}</ul>`;
}
function educacion(){
  $("#edu").innerHTML = `<div><h3>${esc(t("e_edu"))}</h3>${linea(EDU)}</div><div><h3>${esc(t("e_exp"))}</h3>${linea(EXP)}</div>`;
}
function participacion(){
  $("#part").innerHTML = PART.map((p,i) => `
    <article class="card tiltc">
      ${p.img ? `<div class="thumb"><img class="${p.fit || "cover"}" src="${p.img}" alt="${esc(L(p.titulo))}" loading="lazy"></div>` : ""}
      <span class="no">0${i+1}</span><h3>${esc(L(p.titulo))}</h3>
      <p>${esc(L(p.desc))}</p>
      ${p.detalle ? `<p class="meta" style="margin-top:8px">${esc(L(p.detalle))}</p>` : ""}
      ${p.tags ? `<div class="chips">${p.tags.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>` : ""}
      ${p.url ? `<div class="btns" style="margin-top:12px"><a class="btn ghost ext" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t("t_site"))}</a></div>` : ""}
    </article>`).join("");
}
function cv(){
  const contacto = [PERFIL.correo, PERFIL.telefono, L(PERFIL.ciudad), PERFIL.linkedin].filter(Boolean).map(esc).join(" · ");
  const ord = CERTS.filter(c => c.org === "Cisco" || c.org === "INADEH").sort((a,b) => b.fecha.localeCompare(a.fecha));
  $("#cv-sheet").innerHTML = `
    <h1>${esc(PERFIL.nombre)}</h1>
    <div class="role">${esc(t("cv_role"))}</div>
    <div class="contact">${contacto}</div>
    <h3>${esc(t("cv_profile"))}</h3><p>${esc(t("cv_summary"))}</p>
    <h3>${esc(t("cv_edu"))}</h3>
    <ul><li><b>${esc(L(EDU[0].titulo))}</b>, ${esc(L(EDU[0].lugar))} (${esc(t("cv_inprogress"))}).</li></ul>
    <h3>${esc(t("cv_exp"))}</h3>
    <ul>${EXP.map(x => `<li><b>${esc(L(x.titulo))}</b>, ${esc(L(x.lugar))} (${esc(L(x.cuando))}). ${esc(L(x.detalle))}</li>`).join("")}</ul>
    <h3>${esc(t("cv_pubs"))}</h3>
    <ul>${PUBS.map(p => `<li>${esc(p.titulo)}. ${esc(L(p.medio))}, ${esc(L(p.fecha))}.</li>`).join("")}</ul>
    <h3>${esc(t("cv_part"))}</h3>
    <ul>${PART.map(p => `<li><b>${esc(L(p.titulo))}</b>${(p.cv || p.detalle) ? `, ${esc(L(p.cv || p.detalle))}` : ""}</li>`).join("")}</ul>
    <h3>${esc(t("cv_courses"))}</h3>
    <ul>${ord.map(c => `<li><b>${esc(c.titulo)}</b>, ${esc(c.org)} (${esc(L(c.fechaTxt))})${c.horas ? `, ${c.horas} ${esc(t("hrs"))}` : ""}.</li>`).join("")}</ul>
    <h3>${esc(t("cv_skills"))}</h3>
    <p>${AREAS[lang].map(esc).join(" · ")}</p>`;
}
function contacto(){
  const f = [], corto = u => String(u).replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  const card = (h, val, btns) => `<div class="card cc"><h3>${esc(h)}</h3><div class="val">${esc(val)}</div><div class="btns">${btns}</div></div>`;
  if (PERFIL.linkedin) f.push(card("LinkedIn", corto(PERFIL.linkedin), `<a class="btn ext" href="${esc(PERFIL.linkedin)}" target="_blank" rel="noopener">${esc(t("x_btn"))}</a>`));
  if (PERFIL.correo) f.push(card(t("x_mail"), PERFIL.correo, `<button class="btn" type="button" data-copy="${esc(PERFIL.correo)}">${esc(t("x_copy"))}</button><a class="btn ghost ext" href="mailto:${esc(PERFIL.correo)}">${esc(t("x_write"))}</a>`));
  if (PERFIL.telefono) f.push(card(t("x_tel"), PERFIL.telefono, `<button class="btn" type="button" data-copy="${esc(PERFIL.telefono)}">${esc(t("x_copy2"))}</button>`));
  if (PERFIL.github) f.push(card("GitHub", corto(PERFIL.github), `<a class="btn ext" href="${esc(PERFIL.github)}" target="_blank" rel="noopener">${esc(t("x_open"))} GitHub</a>`));
  f.push(card(t("orcid"), corto(PERFIL.orcid), `<a class="btn ext" href="${esc(PERFIL.orcid)}" target="_blank" rel="noopener">${esc(t("x_open"))} ORCID</a>`));
  f.push(card(t("x_loc"), L(PERFIL.ciudad), ""));
  $("#contactList").innerHTML = f.join("");
}
$("#contactList").addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = t("x_copied"); }
  catch(_) {
    const r = document.createRange(); r.selectNodeContents(b.closest(".cc").querySelector(".val"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = t("x_sel");
  }
  setTimeout(() => { b.textContent = b.dataset.copy.includes("@") ? t("x_copy") : t("x_copy2"); }, 2200);
});
function enlacesLinkedin(){
  const a = $("#liHero");
  if (PERFIL.linkedin) { a.href = PERFIL.linkedin; a.target = "_blank"; a.rel = "noopener"; a.classList.add("ext"); }
}
function render(){ estatico(); filtros(); certs(); pubs(); habilidades(); educacion(); participacion(); cv(); contacto(); enlacesLinkedin(); }
render();

/* Idioma */
function setLang(l){
  lang = l; try { localStorage.setItem("ig-lang", l); } catch(_) {}
  if (overlay.classList.contains("show")) cerrar();
  render();
}
$("#lang-es").addEventListener("click", () => setLang("es"));
$("#lang-en").addEventListener("click", () => setLang("en"));

/* Filtros y ventana */
$("#filters").addEventListener("click", e => {
  const b = e.target.closest(".filter"); if (!b) return;
  filtro = b.dataset.o; filtros(); certs();
});
const overlay = $("#overlay"); let ultimoFoco = null;
function abrir(i){
  const c = CERTS[i]; ultimoFoco = document.activeElement;
  $("#mPic").innerHTML = `<img class="${c.tipo === "badge" ? "badge" : ""}" src="${c.img}" alt="${esc(c.titulo)} – ${esc(c.org)}">`;
  $("#mTitle").textContent = c.titulo;
  $("#mOrg").textContent = c.org;
  $("#mDesc").textContent = L(c.desc);
  $("#mInfo").innerHTML = `<dt>${esc(t("m_date"))}</dt><dd>${esc(L(c.fechaTxt))}</dd>` + (c.horas ? `<dt>${esc(t("m_dur"))}</dt><dd>${c.horas} ${esc(t("m_hours"))}</dd>` : "");
  $("#mLinks").innerHTML = c.url ? `<a class="btn ext" href="${esc(c.url)}" target="_blank" rel="noopener">Verificar</a>` : "";
  overlay.classList.add("show"); $("#mClose").focus(); confeti(innerWidth / 2, innerHeight / 3);
}
function cerrar(){ overlay.classList.remove("show"); if (ultimoFoco) ultimoFoco.focus(); }
$("#certGrid").addEventListener("click", e => { const b = e.target.closest(".cert"); if (b) abrir(+b.dataset.i2); });
$("#mClose").addEventListener("click", cerrar);
overlay.addEventListener("click", e => { if (e.target === overlay) cerrar(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("show")) cerrar(); });

/* CV */
$("#copyCv").addEventListener("click", async e => {
  const b = e.currentTarget, txt = $("#cv-sheet").innerText;
  try { await navigator.clipboard.writeText(txt); b.textContent = t("v_copied"); }
  catch(_) {
    const r = document.createRange(); r.selectNodeContents($("#cv-sheet"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    b.textContent = t("v_sel");
  }
  setTimeout(() => { b.textContent = t("v_copy"); }, 2500);
});
$("#toggleCv").addEventListener("click", e => {
  const sheet = $("#cv-sheet"); sheet.hidden = !sheet.hidden;
  e.currentTarget.textContent = sheet.hidden ? t("v_show") : t("v_hide");
  e.currentTarget.setAttribute("aria-expanded", !sheet.hidden);
});

/* Navegación */
const navbox = $("#navbox");
$("#menuBtn").addEventListener("click", e => {
  const open = navbox.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", open);
});
navbox.addEventListener("click", e => { if (e.target.closest("a")) navbox.classList.remove("open"); });
const links = [...document.querySelectorAll("a.link")];
const obs = new IntersectionObserver(es => {
  es.forEach(en => { if (en.isIntersecting) links.forEach(l => l.classList.toggle("active", l.getAttribute("href") === "#" + en.target.id)); });
}, { rootMargin: "-40% 0px -55% 0px" });
["sobre-mi","certificados","publicaciones","habilidades","educacion","participacion","cv","contacto"].forEach(id => { const s = document.getElementById(id); if (s) obs.observe(s); });

/* =========================================================
   MOVIMIENTO Y MASCOTAS: Chispa (robot con birrete) y Pixel (gato)
   ========================================================= */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FINE = matchMedia("(hover: hover) and (pointer: fine)").matches;
const wait = ms => new Promise(r => setTimeout(r, ms));
const EX = {
  es: {
    typed:["Estudiante de informática","Voluntario de informática","Autor de artículos","Competidor en ciberseguridad"],
    st1:"certificados", st2:"artículos publicados", st3:"retos y proyectos", st4:"horas de inglés en el INADEH",
    says:["¡Hola! Soy Chispa, tu guía por este portafolio.","Isaías hace voluntariado en informática y escribe artículos.","Mira sus certificados de Cisco, INADEH, OEA y Copa Airlines.","¡Conectemos en LinkedIn!"],
    tips:{ "inicio":"¡Bienvenido! Soy Pixel. Desliza para conocer a Isaías.", "sobre-mi":"Isaías une tecnología y educación.", "certificados":"Toca un certificado para verlo en grande.",
      "publicaciones":"Dos artículos publicados. ¡Léelos!", "habilidades":"Voluntariado, IA, ciberseguridad y más.", "educacion":"Estudia en la Universidad de Panamá y fue voluntario con niños de primaria.",
      "participacion":"Hackathon, OEA y CONAC: retos en equipo.", "cv":"Copia el CV con un clic.", "contacto":"¿Hablamos? Conéctate en LinkedIn." },
    purr:"¡Purr! Gracias por la caricia.", pets_hide:"Ocultar mascotas", pets_show:"Mostrar mascotas",
    chispa:"Chispa, mascota robot con birrete. Toca para saludar.", pixel:"Pixel, mascota gato. Toca para acariciar.", hide:"Ocultar a Pixel",
    orgs:["Cisco","INADEH","OEA","hackrocks","Copa Airlines","Universidad de Panamá"]
  },
  en: {
    typed:["Computer science student","Computing volunteer","Article author","Cybersecurity competitor"],
    st1:"certificates", st2:"published articles", st3:"challenges and projects", st4:"English hours at INADEH",
    says:["Hi! I'm Chispa, your guide through this portfolio.","Isaías volunteers teaching computing and writes articles.","Check out his Cisco, INADEH, OAS and Copa Airlines certificates.","Let's connect on LinkedIn!"],
    tips:{ "inicio":"Welcome! I'm Pixel. Scroll to meet Isaías.", "sobre-mi":"Isaías blends technology and education.", "certificados":"Tap a certificate to see it larger.",
      "publicaciones":"Two published articles. Give them a read!", "habilidades":"Volunteering, AI, cybersecurity and more.", "educacion":"He studies at the University of Panama and volunteered with primary school kids.",
      "participacion":"Hackathon, OAS and CONAC: team challenges.", "cv":"Copy the CV with one click.", "contacto":"Shall we talk? Connect on LinkedIn." },
    purr:"Purr! Thanks for the pets.", pets_hide:"Hide pets", pets_show:"Show pets",
    chispa:"Chispa, robot mascot with a graduation cap. Tap to say hi.", pixel:"Pixel, cat mascot. Tap to pet.", hide:"Hide Pixel",
    orgs:["Cisco","INADEH","OAS","hackrocks","Copa Airlines","University of Panama"]
  }
};
let pets = true, sec = "inicio", sayIdx = 0;
try { if (localStorage.getItem("ig-pets") === "0") pets = false; } catch(_) {}

function paintPets(){
  document.body.classList.toggle("nopets", !pets);
  const x = EX[lang];
  $("#petsBtn").textContent = pets ? x.pets_hide : x.pets_show;
  $("#petsBtn").setAttribute("aria-pressed", pets);
}
function setPets(v){ pets = v; try { localStorage.setItem("ig-pets", v ? "1" : "0"); } catch(_) {} paintPets(); }
function tip(){ $("#petText").textContent = EX[lang].tips[sec] || ""; }
function stats(){
  const x = EX[lang], hrs = CERTS.reduce((a,c) => a + (c.horas || 0), 0);
  const items = [[CERTS.length, x.st1],[PUBS.length, x.st2],[PART.length, x.st3],[hrs, x.st4]];
  const primera = !$("#stats").children.length;
  $("#stats").innerHTML = items.map(([n,l]) => `<div class="stat"><b data-n="${n}">${n}</b><span>${esc(l)}</span></div>`).join("");
  if (primera && !RM) document.querySelectorAll(".stat b").forEach(el => {
    const fin = +el.dataset.n, t0 = performance.now();
    (function paso(t){ const p = Math.min((t - t0)/1100, 1); el.textContent = Math.round(fin * (1 - Math.pow(1-p, 3))); if (p < 1) requestAnimationFrame(paso); })(t0);
  });
}
function ticker(){
  const cols = ["--terra","--mustard","--sage","--accent"];
  const items = [...AREAS[lang], ...EX[lang].orgs];
  const una = items.map((x,i) => `<span class="tk"><i style="color:var(${cols[i % 4]})">◆</i>${esc(x)}</span>`).join("");
  $("#track").innerHTML = una + una;
}
function extras(){
  const x = EX[lang];
  stats(); ticker(); tip(); paintPets();
  $("#chispaBtn").setAttribute("aria-label", x.chispa);
  $("#petBtn").setAttribute("aria-label", x.pixel);
  $("#petHide").setAttribute("aria-label", x.hide);
  if (!$("#say").dataset.set) { $("#say").textContent = x.says[0]; $("#say").dataset.set = "1"; } else { $("#say").textContent = x.says[sayIdx % x.says.length]; }
}
const _render = render;
render = function(){ _render(); extras(); };
extras();

/* Efectos */
function confeti(cx, cy){
  if (RM) return;
  const cols = ["--terra","--mustard","--sage","--accent"];
  for (let i = 0; i < 16; i++){
    const d = document.createElement("span"), a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 90;
    d.className = "confetti"; d.style.left = cx + "px"; d.style.top = cy + "px";
    d.style.background = `var(${cols[i % 4]})`;
    d.style.setProperty("--dx", Math.cos(a) * r + "px"); d.style.setProperty("--dy", Math.sin(a) * r - 30 + "px"); d.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
    document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
  }
}
function corazones(cx, cy){
  if (RM) return;
  for (let i = 0; i < 5; i++){
    const h = document.createElement("span"); h.className = "heart"; h.textContent = "♥";
    h.style.left = (cx - 20 + Math.random() * 40) + "px"; h.style.top = cy + "px"; h.style.animationDelay = (i * 0.09) + "s";
    document.body.appendChild(h); setTimeout(() => h.remove(), 1400);
  }
}
function reiniciar(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* Chispa */
$("#chispaBtn").addEventListener("click", e => {
  const b = e.currentTarget, r = b.getBoundingClientRect();
  sayIdx = (sayIdx + 1) % EX[lang].says.length;
  $("#say").textContent = EX[lang].says[sayIdx];
  reiniciar(b, "jump"); confeti(r.left + r.width / 2, r.top + r.height / 2);
});
const pupilas = document.querySelectorAll("#chispa .pupil");
document.addEventListener("pointermove", e => {
  const r = $("#chispa").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * 0.4;
  const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / 160)) * 4, dy = Math.max(-1, Math.min(1, (e.clientY - cy) / 160)) * 3.5;
  pupilas.forEach(p => { p.style.transform = `translate(${dx}px,${dy}px)`; });
}, { passive: true });

/* Pixel */
let purrT = null;
$("#petBtn").addEventListener("click", e => {
  const r = e.currentTarget.getBoundingClientRect();
  $("#petText").textContent = EX[lang].purr; $("#pbubble").style.display = "";
  reiniciar(e.currentTarget, "hop"); corazones(r.left + r.width / 2, r.top + 10);
  clearTimeout(purrT); purrT = setTimeout(tip, 2600);
});
$("#petHide").addEventListener("click", () => { $("#pbubble").style.display = "none"; });
$("#petsBtn").addEventListener("click", () => setPets(!pets));
const secObs = new IntersectionObserver(es => {
  es.forEach(en => { if (en.isIntersecting){ sec = en.target.id; $("#pbubble").style.display = ""; tip(); reiniciar($("#petBtn"), "hop"); } });
}, { rootMargin: "-45% 0px -50% 0px" });
["inicio","sobre-mi","certificados","publicaciones","habilidades","educacion","participacion","cv","contacto"].forEach(id => { const el = document.getElementById(id); if (el) secObs.observe(el); });

/* Texto que se escribe solo */
const typedEl = $("#typed");
typedEl.textContent = EX[lang].typed[0];
if (!RM) (async function ciclo(){
  let i = 0;
  while (true){
    await wait(2400);
    let cur = typedEl.textContent;
    while (cur.length){ cur = cur.slice(0, -1); typedEl.textContent = cur; await wait(28); }
    const lista = EX[lang].typed; i = (i + 1) % lista.length; const nuevo = lista[i];
    for (let k = 1; k <= nuevo.length; k++){ typedEl.textContent = nuevo.slice(0, k); await wait(55); }
  }
})();

/* Aparición al desplazarse y barra de progreso */
const rvObs = new IntersectionObserver(es => {
  es.forEach(en => { if (en.isIntersecting){ en.target.classList.add("in"); rvObs.unobserve(en.target); } });
}, { threshold: 0.12 });
document.querySelectorAll(".sec, .lead, .about .card, .pub, .skills .card, .two > div, .cv, #contactList").forEach(el => { el.classList.add("rv"); rvObs.observe(el); });
addEventListener("scroll", () => {
  const h = document.documentElement, max = h.scrollHeight - h.clientHeight;
  $("#prog").style.transform = `scaleX(${max > 0 ? h.scrollTop / max : 0})`;
}, { passive: true });

/* Inclinación 3D de las tarjetas (solo con ratón) */
if (FINE && !RM){
  document.addEventListener("pointermove", e => {
    const c = e.target.closest && e.target.closest(".cert, .tiltc"); if (!c) return;
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    c.style.setProperty("--ry", (x * 10).toFixed(2) + "deg"); c.style.setProperty("--rx", (-y * 10).toFixed(2) + "deg");
  });
  document.addEventListener("pointerout", e => {
    const c = e.target.closest && e.target.closest(".cert, .tiltc");
    if (c && !c.contains(e.relatedTarget)){ c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); }
  });
}
</script>

</body></html>
